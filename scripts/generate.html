<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成新图 · AI Manga Studio</title>
<style>
:root{color-scheme:light;--ink:#22362d;--muted:#596a60;--line:#d6dcd3;--green:#205647}
*{box-sizing:border-box}
body{margin:0;background:#f5f4ef;color:var(--ink);font:16px/1.55 "Source Sans 3","PingFang SC",system-ui,sans-serif}
header{display:flex;gap:32px;align-items:center;background:white;border-bottom:1px solid var(--line);padding:0 clamp(16px,4vw,64px);flex-wrap:wrap}
header strong{letter-spacing:.04em}nav{display:flex;gap:22px}nav a{color:var(--muted);text-decoration:none;padding:17px 0;border-bottom:3px solid transparent}
nav a[aria-current]{color:var(--green);border-color:var(--green);font-weight:650}
main{max-width:1180px;margin:clamp(20px,5vw,60px) auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start;gap:20px}
section{background:white;padding:clamp(18px,3vw,32px);border:1px solid var(--line);border-radius:12px}
h1,h2{margin:0 0 20px;line-height:1.25}h1{font-size:26px}h2{font-size:21px}
label,summary{font-weight:600}label{display:block;margin-bottom:5px}
textarea,input,select{display:block;width:100%;font:inherit;border:1px solid #b6c2b8;border-radius:7px;padding:9px 11px;background:#fff;color:var(--ink)}
textarea{min-height:145px;resize:vertical}form>*+*,details>div{margin-top:17px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}details{border-top:1px solid var(--line);padding-top:13px}
summary{cursor:pointer;color:var(--green)}button,.action{border:1px solid var(--green);border-radius:7px;padding:9px 15px;font:inherit;cursor:pointer;background:var(--green);color:white;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}.action{display:inline-block;background:white;color:var(--green);margin:4px 4px 4px 0}
:focus-visible{outline:3px solid #de9a44;outline-offset:2px}.muted,small{color:var(--muted)}small{display:block;margin-top:5px}
#prompt-error{color:#993e28;white-space:pre-wrap}#status{font-weight:650}#info,#folder,pre{overflow-wrap:anywhere;white-space:pre-wrap}
pre{font-size:12px;max-height:15rem;overflow:auto;background:#f5f6f2;padding:10px;border-radius:5px}
#preview{width:100%;max-height:55vh;object-fit:contain;border-radius:6px;background:#f2f2eb}#history{margin-top:18px}
[hidden]{display:none!important}@media(max-width:730px){main{grid-template-columns:1fr}header{gap:15px}nav{gap:12px}.pair{gap:8px}}
</style>
</head>
<body>
<header><strong>AI Manga Studio</strong><nav aria-label="工作台"><a href="/studio" aria-current="page">生成新图</a><a href="/">局部微调</a></nav></header>
<main>
<section><h1>生成新图</h1>
<form id="form">
<div><label for="prompt">画面描述</label><textarea id="prompt" required maxlength="20000" placeholder="例如，雨后的海港，穿黄色雨衣的女孩蹲在石阶上，和一只抬头的三花猫对视。"></textarea></div>
<div class="pair">
<div><label for="aspect">画幅</label><select id="aspect"><option value="auto">根据描述决定</option><option>16:9</option><option>9:16</option><option>3:2</option><option>2:3</option><option>1:1</option></select></div>
<div><label for="quality">输出尺寸</label><select id="quality"><option value="4K">4K</option><option value="8K">4K + 8K</option></select></div>
</div>
<div><label for="style">画风（可选）</label><input id="style" maxlength="500" placeholder="例如，日系商业插画、透明水彩"></div>
<details><summary>生成设置</summary><div class="pair">
<div><label for="rounds">最多尝试轮数</label><select id="rounds"><option value="1">1 轮</option><option value="2">2 轮</option><option value="3">3 轮</option><option value="0">时限内持续尝试</option></select></div>
<div><label for="seed">起始种子</label><input id="seed" inputmode="numeric" pattern="[0-9]{1,19}" placeholder="随机"></div>
</div></details>
<button id="submit" type="submit">开始本地生成</button>
<div id="prompt-error" role="alert" hidden></div>
</form></section>
<section><h2>生成任务</h2>
<div id="history" hidden><label for="recent">最近的网页任务</label><select id="recent"></select></div>
<p class="muted" id="empty">提交后可在这里查看进度和定稿。</p>
<div id="job" hidden>
<p id="status" role="status"></p><p id="info"></p>
<img id="preview" alt="通过本地终审的成品预览" hidden>
<div id="actions"></div>
<details><summary>任务目录与运行日志</summary><p id="folder"></p><pre id="log"></pre></details>
</div>
</section></main>
<script>
'use strict';
const el=id=>document.getElementById(id);
let requestId, payload, timer, watching;
async function api(path,options){
 const response=await fetch(path,options);
 const data=await response.json();
 if(!response.ok)throw Error(data.error||'本地请求失败');
 return data;
}
function addAction(label,href,newTab){
 const a=document.createElement('a');a.className='action';a.textContent=label;a.href=href;
 if(newTab){a.target='_blank';a.rel='noopener'}el('actions').append(a);
}
function display(id,data){
 el('status').textContent=(data.round?'第 '+data.round+' 轮 · ':'')+data.status;
 const latest=data.log?.split('\n').filter(line=>line.trim()).at(-1);
 el('info').textContent=data.reason||(!data.done&&latest?latest.slice(-240):'');
 el('folder').textContent=[data.folder,data.exported].filter(Boolean).join('\n');
 el('log').textContent=data.log||'等候运行日志…';
 el('actions').replaceChildren();
 if(data.images.length&&(data.accepted||data.manual)){
  if(data.manual)el('status').textContent=data.title;
  const prefix='/jobs/'+id+'/';
  el('preview').alt=data.title||'4K 成品';el('preview').src=prefix+data.images[0];el('preview').hidden=false;
  for(const file of data.images){
   addAction(data.manual?'打开 4K · 需要人工 review':'打开 '+file.replace('.png','')+' 原图',prefix+file,true);
   addAction('微调 '+file.replace('.png',''),'/?image='+encodeURIComponent(data.relative+'/'+file),false);
  }
 }
}
async function watch(id){
 clearTimeout(timer);watching=id;
 el('recent').value=id;el('empty').hidden=true;el('job').hidden=false;el('preview').hidden=true;
 el('actions').replaceChildren();el('status').textContent='读取任务…';
 for(const key of ['info','log','folder'])el(key).textContent='';
 async function poll(){
  if(watching!==id)return;
  try{
   const data=await api('/jobs/'+id);
   if(watching!==id)return;
   display(id,data);if(data.done)return;
  }catch(e){if(watching!==id)return;el('status').textContent='读取进度失败：'+e.message}
  timer=setTimeout(poll,3000);
 }
 await poll();
}
async function historyList(){
 const jobs=await api('/generations');
 el('recent').replaceChildren(...jobs.map(job=>new Option(job.prompt,job.id)));
 el('history').hidden=!jobs.length;
 return jobs;
}
function choose(id){
 if(location.hash.slice(1)!==id)location.hash=id;
 else watch(id);
}
el('recent').onchange=()=>choose(el('recent').value);
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(/^[a-f0-9]{32}$/.test(id))watch(id)});
el('form').onsubmit=async event=>{
 event.preventDefault();if(el('submit').disabled)return;
 el('prompt-error').hidden=true;
 const values={prompt:el('prompt').value.trim(),aspect:el('aspect').value,quality:el('quality').value,
  style:el('style').value.trim(),rounds:Number(el('rounds').value),seed:el('seed').value.trim()};
 if(!values.prompt){el('prompt').focus();return}
 const encoded=JSON.stringify(values);
 if(!requestId||encoded!==payload){requestId=crypto.randomUUID().replaceAll('-','');payload=encoded}
 el('submit').disabled=true;
 try{
  const data=await api('/generations',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Retouch':'1'},body:JSON.stringify({...values,request:requestId})});
  choose(data.job);await historyList();el('recent').value=data.job;requestId=null;
 }catch(e){el('prompt-error').textContent=e.message;el('prompt-error').hidden=false}
 finally{el('submit').disabled=false}
};
(async()=>{
 try{const jobs=await historyList();const hash=location.hash.slice(1);
  if(/^[a-f0-9]{32}$/.test(hash))watch(hash);else if(jobs.length)choose(jobs[0].id);
 }catch(e){el('empty').textContent='读取任务记录失败：'+e.message}
})();
</script></body></html>
